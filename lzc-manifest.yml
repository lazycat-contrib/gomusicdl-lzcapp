application:
  subdomain: musicdl
  upstreams:
    - location: /
      backend: http://musicdl:8080/
  public_path:
    - /
services:
  musicdl:
    # guohuiyuan/go-music-dl
    # upstream: guohuiyuan/go-music-dl:1.1.0
    image: docker.1ms.run/guohuiyuan/go-music-dl:1.1.0
    user: root
    command: "./music-dl web --port 8080 --no-browser "
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/root/data
